name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          PAGES_REPOSITORY: ${{ github.event.repository.name }}
          PAGES_OWNER: ${{ github.repository_owner }}
        run: |
          shopt -s nocasematch
          if [[ "$PAGES_REPOSITORY" == "$PAGES_OWNER.github.io" ]]; then
            npm run build -- --base /
          else
            npm run build -- --base "/${PAGES_REPOSITORY}/"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload build
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
